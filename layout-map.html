<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      html.tpl-loading body {
        opacity: 0;
      }
      body {
        opacity: 1;
        transition: opacity 0.3s ease;
      }
    </style>
    <script>
      document.documentElement.classList.add('tpl-loading');
      window.__tplReveal = function () {
        document.documentElement.classList.remove('tpl-loading');
      };
      setTimeout(function () {
        window.__tplReveal && window.__tplReveal();
      }, 3000);
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:type" content="website" />
    <title data-page-title>태안 연포 하이바다 펜션</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" type="text/css" href="styles/theme.css" />
    <link rel="stylesheet" type="text/css" href="styles/reset.css" />
    <link rel="stylesheet" type="text/css" href="styles/style.css" />
    <link rel="stylesheet" type="text/css" href="styles/popup.css" />
    <link
      rel="stylesheet"
      type="text/css"
      href="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css"
    />
    <!-- Open Graph Meta Tags for Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="태안 연포 하이바다 펜션" />
  <meta property="og:description" content="아름다운 해수욕장이 보이는 연포 하이바다 펜션입니다. 소중한 반려견과 함께 잊지 못할 추억을 만들어 보세요." />
  <meta property="og:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/09/21/9o1uw3m4GA75.jpg" />
  <meta property="og:url" content="https://yeonpohibada.co.kr" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="태안 연포 하이바다 펜션" />
  <meta name="twitter:description" content="아름다운 해수욕장이 보이는 연포 하이바다 펜션입니다. 소중한 반려견과 함께 잊지 못할 추억을 만들어 보세요." />
  <meta name="twitter:image" content="https://bookingplay-media.s3.amazonaws.com/item_images/2026/09/21/9o1uw3m4GA75.jpg" />
  <meta name="naver-site-verification" content="a41dcb20395dfb0ed41f2a35c8611eaa5a1d0b5d" />
  <meta name="google-site-verification" content="IrJaF2iM61YgX9ncFuFa_zz_CWjTgVoB2k3PKH8Luso" />
</head>

  <body oncontextmenu="return false;" onselectstart="return false" ondragstart="return false;">
    <div id="wrap">
      <div id="header-wrap"></div>

      <div id="container">
        <section id="content" class="sub2_1 sub_room">
          <!-- 원본 room.html 목록은 히어로가 슬라이더가 아니라 고정 배경이다 -->
          <div class="sub_wide_visual visual" data-layout-hero>
            <div class="visual_box">
              <div class="visual_txt">
                <div>
                  <strong data-layout-hero-title></strong>
                  <p data-layout-hero-description></p>
                </div>
              </div>
            </div>
          </div>
          <!--// sub_visual -->

          <div class="sub_cate_wrap">
            <div class="inner">
              <ul data-room-list-nav>
                <li class="on"><a href="./layout-map.html">미리보기</a></li>
              </ul>
            </div>
          </div>

          <div class="sub_cont">
            <div class="main_room inner">
              <div class="title_box">
                <h3 data-layout-room-title></h3>
                <p data-layout-room-description></p>
              </div>
              <div class="room_list">
                <div class="swiper-container">
                  <div class="swiper-wrapper" data-room-list-slides></div>
                </div>
              </div>
            </div>

            <!-- 배치도 — 이 페이지의 본 목적이라 이미지가 없어도 자리를 유지한다 -->
            <div class="wide_img inner" data-layout-map>
              <div class="title_box">
                <h3 data-layout-map-title></h3>
                <p data-layout-map-description></p>
              </div>
              <div data-layout-map-images></div>
            </div>
          </div>
          <!--// sub_cont -->
        </section>
      </div>
      <!--// container -->
    </div>

    <!-- 푸터는 #wrap(max-width:1920px) 밖에 둔다 — 위 테두리(border-top)가 화면 폭을 꽉 채우도록 -->
    <div id="footer-wrap"></div>

    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script src="js/image-helpers.js"></script>
    <script src="js/preview-handler.js"></script>
    <script src="js/data-mapper/core/base-mapper.js"></script>
    <script src="js/data-mapper/pages/header-footer-mapper.js"></script>
    <script src="js/data-mapper/pages/layout-map-mapper.js"></script>
    <script src="js/header-footer-loader.js"></script>
    <script src="js/common.js"></script>
    <script src="js/pages/layout-map.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
